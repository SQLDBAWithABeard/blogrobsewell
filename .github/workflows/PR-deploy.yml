name: Build and Deploy PR Preview

# Token-free PR previews: builds the site and publishes it to
# gh-pages/pr-preview/pr-<N>/ using only the built-in GITHUB_TOKEN
# (no surge.sh account or SURGE_TOKEN required). Auto-torn-down on close.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go (Hugo modules need a Go toolchain)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build
        if: github.event.action != 'closed'
        run: |
          hugo --minify --buildDrafts --buildFuture \
            --baseURL "https://blog.robsewell.com/pr-preview/pr-${{ github.event.number }}/"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
